<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="ibmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F62FE"/>
      <stop offset="100%" stop-color="#0043CE"/>
    </linearGradient>
  </defs>
  <!-- 8 horizontal stripes forming the iconic IBM logo -->
  <g fill="url(#ibmBlue)">
    <!-- Bar 1 (y: 6 to 12) -->
    <rect x="12" y="6" width="38" height="6"/>
    <rect x="58" y="6" width="60" height="6"/>
    <rect x="126" y="6" width="14" height="6"/>
    <rect x="180" y="6" width="14" height="6"/>

    <!-- Bar 2 (y: 15 to 21) -->
    <rect x="12" y="15" width="38" height="6"/>
    <rect x="58" y="15" width="60" height="6"/>
    <rect x="126" y="15" width="14" height="6"/>
    <rect x="145" y="15" width="9" height="6"/>
    <rect x="166" y="15" width="9" height="6"/>
    <rect x="180" y="15" width="14" height="6"/>

    <!-- Bar 3 (y: 24 to 30) -->
    <rect x="25" y="24" width="12" height="6"/>
    <rect x="58" y="24" width="14" height="6"/>
    <rect x="99" y="24" width="18" height="6"/>
    <rect x="126" y="24" width="14" height="6"/>
    <rect x="151" y="24" width="18" height="6"/>
    <rect x="180" y="24" width="14" height="6"/>

    <!-- Bar 4 (y: 33 to 39) -->
    <rect x="25" y="33" width="12" height="6"/>
    <rect x="58" y="33" width="56" height="6"/>
