    <rect x="58" y="42" width="56" height="6"/>
    <rect x="126" y="42" width="14" height="6"/>
    <rect x="180" y="42" width="14" height="6"/>

    <!-- Bar 6 (y: 51 to 57) -->
    <rect x="25" y="51" width="12" height="6"/>
    <rect x="58" y="51" width="14" height="6"/>
    <rect x="99" y="51" width="18" height="6"/>
    <rect x="126" y="51" width="14" height="6"/>
    <rect x="180" y="51" width="14" height="6"/>

    <!-- Bar 7 (y: 60 to 66) -->
    <rect x="12" y="60" width="38" height="6"/>
