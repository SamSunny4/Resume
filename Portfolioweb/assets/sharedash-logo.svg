<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <defs>
    <linearGradient id="sd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e29" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
    <linearGradient id="line-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="line-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="sd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="108" height="108" rx="24" fill="url(#sd-bg)" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1.5"/>
  
  <!-- Multipath Connecting Streams -->
  <path d="M38,54 L70,38" stroke="url(#line-cyan)" stroke-width="4.5" stroke-linecap="round" filter="url(#sd-glow)" />
  <path d="M38,54 L70,70" stroke="url(#line-emerald)" stroke-width="4.5" stroke-linecap="round" filter="url(#sd-glow)" />
  
  <!-- Center Core Node (Multipath Engine) -->
  <circle cx="38" cy="54" r="13" fill="#2563eb" filter="url(#sd-glow)" />
  <circle cx="38" cy="54" r="11" fill="#3B82F6" />
  <circle cx="38" cy="54" r="4.5" fill="#FFFFFF" />
  
  <!-- Satellite Nodes (Wi-Fi Direct & USB/Hotspot Endpoints) -->
  <circle cx="70" cy="38" r="10" fill="#06B6D4" filter="url(#sd-glow)" />
  <circle cx="70" cy="38" r="3.5" fill="#FFFFFF" />
  
  <circle cx="70" cy="70" r="10" fill="#10B981" filter="url(#sd-glow)" />
  <circle cx="70" cy="70" r="3.5" fill="#FFFFFF" />
</svg>
